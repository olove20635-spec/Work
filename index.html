<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"
>

<title>บันทึกการเดินทาง</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta name="theme-color" content="#172033">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="บันทึกการเดินทาง">

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --navy:#172033;
  --navy2:#26334d;
  --bg:#f3f5f9;
  --line:#e8ebf0;
  --text:#18202e;
  --muted:#8b93a3;
  --green:#e5f7ec;
  --greenText:#198754;
}


/* =========================
   LOCK MAIN SCREEN
========================= */

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  overscroll-behavior:none;
  background:var(--bg);
}

body{
  color:var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  position:fixed;
  inset:0;
}


/* =========================
   APP
========================= */

.app{
  width:100%;
  max-width:760px;

  height:100%;

  margin:auto;

  overflow:hidden;

  background:var(--bg);

  /* อนุญาต gesture แนวนอน */
  touch-action:pan-x;
}


/* =========================
   HEADER
========================= */

.header{
  background:
    linear-gradient(
      145deg,
      var(--navy),
      var(--navy2)
    );

  color:white;

  padding:
    calc(10px + env(safe-area-inset-top))
    16px
    14px;

  border-radius:
    0 0 24px 24px;

  box-shadow:
    0 8px 24px
    rgba(23,32,51,.18);

  user-select:none;
  -webkit-user-select:none;
}


/* =========================
   MONTH
========================= */

.month-nav{
  display:grid;

  grid-template-columns:
    42px 1fr 42px;

  align-items:center;
}

.nav-btn{
  width:42px;
  height:42px;

  border:none;

  border-radius:13px;

  background:
    rgba(255,255,255,.10);

  color:white;

  font-size:27px;

  cursor:pointer;
}

.month-center{
  text-align:center;
}

.month-title{
  display:inline;

  font-size:21px;

  font-weight:750;
}

.year-title{
  display:inline;

  margin-left:6px;

  font-size:21px;

  font-weight:750;
}


/* =========================
   MONEY
========================= */

.money-area{
  text-align:center;

  margin-top:6px;
}

.money-value{
  font-size:32px;

  font-weight:800;

  letter-spacing:-.5px;
}

.money-value .baht{
  font-size:21px;

  font-weight:650;

  opacity:.8;

  margin-right:3px;
}

.period{
  margin-top:1px;

  font-size:11px;

  color:
    rgba(255,255,255,.65);
}


/* =========================
   SUMMARY
========================= */

.header-summary{
  display:flex;

  justify-content:center;

  align-items:center;

  gap:8px;

  margin-top:9px;
}

.summary-pill{
  background:
    rgba(255,255,255,.10);

  border:
    1px solid
    rgba(255,255,255,.08);

  border-radius:20px;

  padding:6px 11px;

  font-size:11px;

  color:
    rgba(255,255,255,.88);
}

.summary-pill strong{
  font-size:13px;

  color:white;
}

.dot{
  opacity:.4;

  font-size:10px;
}

.hidden-selects{
  display:none;
}


/* =========================
   CALENDAR
========================= */

.calendar-card{
  margin:
    10px 10px 0;

  background:white;

  border-radius:18px;

  overflow:hidden;

  box-shadow:
    0 3px 16px
    rgba(0,0,0,.05);

  /*
    สำคัญ:
    ให้พื้นที่ปฏิทินรับ gesture
    ซ้าย/ขวา
  */

  touch-action:pan-x;

  user-select:none;

  -webkit-user-select:none;
}

.weekdays{
  display:grid;

  grid-template-columns:
    repeat(7,1fr);

  padding:
    9px 3px 7px;

  border-bottom:
    1px solid var(--line);
}

.weekdays div{
  text-align:center;

  font-size:10px;

  font-weight:650;

  color:var(--muted);
}

.weekdays div:first-child{
  color:#e75c5c;
}

.calendar{
  display:grid;

  grid-template-columns:
    repeat(7,1fr);
}

.day{
  position:relative;

  min-height:78px;

  padding:5px 4px;

  border-right:
    1px solid var(--line);

  border-bottom:
    1px solid var(--line);

  background:white;

  overflow:hidden;

  cursor:pointer;
}

.day:nth-child(7n){
  border-right:none;
}

.day.empty{
  background:#fafbfc;
}

.day-number{
  width:23px;
  height:23px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:50%;

  font-size:12px;

  font-weight:700;

  margin-bottom:3px;
}

.day.today .day-number{
  background:var(--navy);

  color:white;
}

.place{
  font-size:9.5px;

  line-height:1.25;

  font-weight:650;

  color:#343d4d;

  display:-webkit-box;

  -webkit-line-clamp:2;

  -webkit-box-orient:vertical;

  overflow:hidden;
}

.stay{
  display:inline-flex;

  margin-top:4px;

  padding:3px 4px;

  border-radius:7px;

  font-size:8px;

  font-weight:700;
}

.stay.yes{
  background:var(--green);

  color:var(--greenText);
}

.stay.no{
  background:#f0f1f4;

  color:#737b89;
}


/* =========================
   POPUP BACKGROUND
========================= */

.modal{
  display:none;

  position:fixed;

  inset:0;

  background:
    rgba(8,15,28,.52);

  backdrop-filter:
    blur(4px);

  -webkit-backdrop-filter:
    blur(4px);

  z-index:1000;

  align-items:center;

  justify-content:center;

  padding:
    calc(20px + env(safe-area-inset-top))
    18px
    calc(20px + env(safe-area-inset-bottom));

  touch-action:none;
}

.modal.show{
  display:flex;
}


/* =========================
   POPUP
========================= */

.modal-box{
  width:100%;

  max-width:520px;

  background:white;

  border-radius:24px;

  padding:
    14px 18px 18px;

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.28);

  max-height:90%;

  overflow-y:auto;

  -webkit-overflow-scrolling:touch;

  touch-action:pan-y;
}

.handle{
  width:42px;

  height:5px;

  background:#d8dbe1;

  border-radius:10px;

  margin:
    0 auto 15px;
}

.modal-small{
  font-size:12px;

  color:var(--muted);
}

.modal-box h2{
  margin:
    4px 0 20px;

  font-size:23px;
}

label{
  display:block;

  font-size:13px;

  font-weight:650;

  margin-bottom:7px;
}


/* =========================
   INPUT
========================= */

input[type="text"]{
  width:100%;

  border:
    1.5px solid #e1e4e9;

  outline:none;

  border-radius:14px;

  padding:14px;

  font-size:17px;

  margin-bottom:18px;

  background:#fafbfc;
}

input[type="text"]:focus{
  border-color:#9aaac7;

  background:white;
}


/* =========================
   STAY
========================= */

.stay-options{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:10px;

  margin-bottom:20px;
}

.stay-option{
  padding:14px 6px;

  border:
    1.5px solid #e2e5ea;

  border-radius:14px;

  text-align:center;

  font-size:13px;

  font-weight:650;

  cursor:pointer;
}

.stay-option.selected{
  border-color:var(--navy);

  background:#f2f5fa;

  color:var(--navy);
}


/* =========================
   BUTTONS
========================= */

.buttons{
  display:grid;

  grid-template-columns:
    .75fr .9fr 1.6fr;

  gap:9px;
}

.buttons button{
  border:none;

  border-radius:13px;

  padding:14px 6px;

  font-size:14px;

  font-weight:700;

  cursor:pointer;
}

.delete{
  background:#fff0f0;

  color:#d84444;
}

.cancel{
  background:#eef0f3;

  color:#505866;
}

.save{
  background:var(--navy);

  color:white;
}


/* =========================
   SMALL SCREEN
========================= */

@media(max-width:380px){

  .day{
    min-height:72px;
  }

  .place{
    font-size:9px;
  }

  .money-value{
    font-size:29px;
  }

  .modal-box{
    padding:
      13px 15px 16px;
  }

}

</style>
</head>


<body>

<div
  class="app"
  id="app"
>


<!-- =========================
     HEADER
========================= -->

<header class="header">

  <div class="month-nav">


    <button
      class="nav-btn"
      onclick="changeMonth(-1)"
      aria-label="เดือนก่อนหน้า"
    >
      ‹
    </button>


    <div class="month-center">

      <span
        id="monthTitle"
        class="month-title"
      ></span>

      <span
        id="yearTitle"
        class="year-title"
      ></span>

    </div>


    <button
      class="nav-btn"
      onclick="changeMonth(1)"
      aria-label="เดือนถัดไป"
    >
      ›
    </button>

  </div>


  <!-- MONEY -->

  <div class="money-area">

    <div class="money-value">

      <span class="baht">
        ฿
      </span>

      <span id="totalAmount">
        0
      </span>

    </div>


    <div
      id="periodText"
      class="period"
    ></div>

  </div>


  <!-- SUMMARY -->

  <div class="header-summary">

    <div class="summary-pill">

      <strong id="travelDays">
        0
      </strong>

      วันเดินทาง

    </div>


    <span class="dot">
      •
    </span>


    <div class="summary-pill">

      <strong id="stayNights">
        0
      </strong>

      คืนค้าง

    </div>

  </div>


  <div class="hidden-selects">

    <select id="monthSelect"></select>

    <select id="yearSelect"></select>

  </div>

</header>


<!-- =========================
     CALENDAR
========================= -->

<section
  class="calendar-card"
  id="swipeArea"
>

  <div class="weekdays">

    <div>อา.</div>

    <div>จ.</div>

    <div>อ.</div>

    <div>พ.</div>

    <div>พฤ.</div>

    <div>ศ.</div>

    <div>ส.</div>

  </div>


  <div
    id="calendar"
    class="calendar"
  ></div>

</section>

</div>


<!-- =========================
     POPUP
========================= -->

<div
  id="modal"
  class="modal"
>

  <div class="modal-box">

    <div class="handle"></div>


    <div class="modal-small">
      รายละเอียดการเดินทาง
    </div>


    <h2 id="modalTitle">
      วันที่
    </h2>


    <label>
      เดินทางไปไหน?
    </label>


    <input
      type="text"
      id="placeInput"
      placeholder="เช่น กรุงเทพฯ"
      autocomplete="off"
    >


    <label>
      การพักค้าง
    </label>


    <div class="stay-options">


      <div
        id="stayYes"
        class="stay-option"
        onclick="selectStay(true)"
      >
        🛏️ ค้าง

        <br>

        300 บาท
      </div>


      <div
        id="stayNo"
        class="stay-option"
        onclick="selectStay(false)"
      >
        🏠 ไม่ค้าง

        <br>

        250 บาท
      </div>


    </div>


    <div class="buttons">


      <button
        class="delete"
        onclick="deleteData()"
      >
        ลบ
      </button>


      <button
        class="cancel"
        onclick="closeModal()"
      >
        ยกเลิก
      </button>


      <button
        class="save"
        onclick="saveData()"
      >
        บันทึก
      </button>


    </div>

  </div>

</div>


<script>


/* =========================
   MONTH DATA
========================= */

const monthNames = [

  "มกราคม",
  "กุมภาพันธ์",
  "มีนาคม",
  "เมษายน",
  "พฤษภาคม",
  "มิถุนายน",
  "กรกฎาคม",
  "สิงหาคม",
  "กันยายน",
  "ตุลาคม",
  "พฤศจิกายน",
  "ธันวาคม"

];


const monthShort = [

  "ม.ค.",
  "ก.พ.",
  "มี.ค.",
  "เม.ย.",
  "พ.ค.",
  "มิ.ย.",
  "ก.ค.",
  "ส.ค.",
  "ก.ย.",
  "ต.ค.",
  "พ.ย.",
  "ธ.ค."

];


/* =========================
   ELEMENTS
========================= */

const monthSelect =
  document.getElementById(
    "monthSelect"
  );


const yearSelect =
  document.getElementById(
    "yearSelect"
  );


const calendar =
  document.getElementById(
    "calendar"
  );


const modal =
  document.getElementById(
    "modal"
  );


const placeInput =
  document.getElementById(
    "placeInput"
  );


const monthTitle =
  document.getElementById(
    "monthTitle"
  );


const yearTitle =
  document.getElementById(
    "yearTitle"
  );


const travelDaysEl =
  document.getElementById(
    "travelDays"
  );


const stayNightsEl =
  document.getElementById(
    "stayNights"
  );


const totalAmountEl =
  document.getElementById(
    "totalAmount"
  );


const periodTextEl =
  document.getElementById(
    "periodText"
  );


const swipeArea =
  document.getElementById(
    "swipeArea"
  );


let selectedDay = null;

let selectedStay = null;


const currentDate =
  new Date();


const currentYear =
  currentDate.getFullYear();


/* =========================
   MONTH OPTIONS
========================= */

monthNames.forEach(
  (month,index) => {

    const option =
      document.createElement(
        "option"
      );


    option.value =
      index;


    option.textContent =
      month;


    monthSelect.appendChild(
      option
    );

  }
);


/* =========================
   YEAR OPTIONS
========================= */

for(
  let year=currentYear-10;
  year<=currentYear+10;
  year++
){

  const option =
    document.createElement(
      "option"
    );


  option.value =
    year;


  option.textContent =
    year;


  yearSelect.appendChild(
    option
  );

}


monthSelect.value =
  currentDate.getMonth();


yearSelect.value =
  currentYear;


/* =========================
   CHANGE MONTH
========================= */

function changeMonth(amount){

  let month =
    Number(
      monthSelect.value
    );


  let year =
    Number(
      yearSelect.value
    );


  month += amount;


  if(month < 0){

    month = 11;

    year--;

  }


  if(month > 11){

    month = 0;

    year++;

  }


  if(
    !Array
      .from(
        yearSelect.options
      )
      .some(
        option =>
          Number(
            option.value
          ) === year
      )
  ){

    const option =
      document.createElement(
        "option"
      );


    option.value =
      year;


    option.textContent =
      year;


    yearSelect.appendChild(
      option
    );

  }


  monthSelect.value =
    month;


  yearSelect.value =
    year;


  renderCalendar();

}


/* =========================
   STORAGE KEY
========================= */

function createKey(
  year,
  month,
  day
){

  /*
    สำคัญ:
    คงรูปแบบเดิม
    เพื่อให้ข้อมูลเก่าไม่หาย
  */

  return (

    "travel-" +

    year +

    "-" +

    (month + 1) +

    "-" +

    day

  );

}


/* =========================
   MONEY
========================= */

function calculatePeriodTotal(
  year,
  month
){

  let startDate;

  let endDate;


  /*
    มกราคม
    1 - 25 มกราคม
  */

  if(month === 0){

    startDate =
      new Date(
        year,
        0,
        1
      );


    endDate =
      new Date(
        year,
        0,
        25
      );

  }


  /*
    ธันวาคม
    26 พ.ย. - 31 ธ.ค.
  */

  else if(month === 11){

    startDate =
      new Date(
        year,
        10,
        26
      );


    endDate =
      new Date(
        year,
        11,
        31
      );

  }


  /*
    ก.พ. - พ.ย.
    26 เดือนก่อน
    ถึง 25 เดือนนี้
  */

  else{

    startDate =
      new Date(
        year,
        month-1,
        26
      );


    endDate =
      new Date(
        year,
        month,
        25
      );

  }


  let total = 0;


  const d =
    new Date(
      startDate
    );


  while(
    d <= endDate
  ){

    const key =
      createKey(

        d.getFullYear(),

        d.getMonth(),

        d.getDate()

      );


    const saved =
      localStorage.getItem(
        key
      );


    if(saved){

      try{

        const data =
          JSON.parse(
            saved
          );


        /*
          ค้าง
        */

        if(
          data.stay === true
        ){

          total += 300;

        }


        /*
          ไม่ค้าง
        */

        else if(
          data.stay === false
        ){

          total += 250;

        }

      }

      catch(error){

        console.error(
          error
        );

      }

    }


    d.setDate(
      d.getDate() + 1
    );

  }


  totalAmountEl.textContent =

    total.toLocaleString(
      "th-TH"
    );


  function shortDate(
    date
  ){

    return (

      date.getDate() +

      " " +

      monthShort[
        date.getMonth()
      ]

    );

  }


  periodTextEl.textContent =

    shortDate(
      startDate
    ) +

    " – " +

    shortDate(
      endDate
    );

}


/* =========================
   RENDER CALENDAR
========================= */

function renderCalendar(){

  calendar.innerHTML =
    "";


  const year =
    Number(
      yearSelect.value
    );


  const month =
    Number(
      monthSelect.value
    );


  monthTitle.textContent =
    monthNames[
      month
    ];


  yearTitle.textContent =
    year;


  calculatePeriodTotal(
    year,
    month
  );


  const firstDay =
    new Date(
      year,
      month,
      1
    ).getDay();


  const daysInMonth =
    new Date(
      year,
      month + 1,
      0
    ).getDate();


  let travelDays = 0;

  let stayNights = 0;


  /* ช่องว่าง */

  for(
    let i=0;
    i<firstDay;
    i++
  ){

    const empty =
      document.createElement(
        "div"
      );


    empty.className =
      "day empty";


    calendar.appendChild(
      empty
    );

  }


  /* วันที่ */

  for(
    let day=1;
    day<=daysInMonth;
    day++
  ){

    const dayBox =
      document.createElement(
        "div"
      );


    dayBox.className =
      "day";


    /*
      วันนี้
    */

    if(

      day ===
      currentDate.getDate()

      &&

      month ===
      currentDate.getMonth()

      &&

      year ===
      currentDate.getFullYear()

    ){

      dayBox.classList.add(
        "today"
      );

    }


    const number =
      document.createElement(
        "div"
      );


    number.className =
      "day-number";


    number.textContent =
      day;


    dayBox.appendChild(
      number
    );


    const key =
      createKey(
        year,
        month,
        day
      );


    const saved =
      localStorage.getItem(
        key
      );


    if(saved){

      try{

        const data =
          JSON.parse(
            saved
          );


        if(

          data.place

          ||

          data.stay === true

          ||

          data.stay === false

        ){

          travelDays++;

        }


        /*
          สถานที่
        */

        if(
          data.place
        ){

          const place =
            document.createElement(
              "div"
            );


          place.className =
            "place";


          place.textContent =
            data.place;


          dayBox.appendChild(
            place
          );

        }


        /*
          ค้าง / ไม่ค้าง
        */

        if(

          data.stay === true

          ||

          data.stay === false

        ){

          const stay =
            document.createElement(
              "div"
            );


          if(
            data.stay === true
          ){

            stay.className =
              "stay yes";


            stay.textContent =
              "🛏 ค้าง";


            stayNights++;

          }

          else{

            stay.className =
              "stay no";


            stay.textContent =
              "ไม่ค้าง";

          }


          dayBox.appendChild(
            stay
          );

        }

      }

      catch(error){

        console.error(
          error
        );

      }

    }


    dayBox.onclick =
      () =>
        openModal(
          day
        );


    calendar.appendChild(
      dayBox
    );

  }


  travelDaysEl.textContent =
    travelDays;


  stayNightsEl.textContent =
    stayNights;

}


/* =========================
   OPEN POPUP
========================= */

function openModal(
  day
){

  selectedDay =
    day;


  selectedStay =
    null;


  const year =
    Number(
      yearSelect.value
    );


  const month =
    Number(
      monthSelect.value
    );


  document
    .getElementById(
      "modalTitle"
    )
    .textContent =

      day +

      " " +

      monthNames[
        month
      ] +

      " " +

      year;


  const key =
    createKey(
      year,
      month,
      day
    );


  const saved =
    localStorage.getItem(
      key
    );


  placeInput.value =
    "";


  document
    .getElementById(
      "stayYes"
    )
    .classList
    .remove(
      "selected"
    );


  document
    .getElementById(
      "stayNo"
    )
    .classList
    .remove(
      "selected"
    );


  if(saved){

    try{

      const data =
        JSON.parse(
          saved
        );


      placeInput.value =
        data.place || "";


      if(

        data.stay === true

        ||

        data.stay === false

      ){

        selectStay(
          data.stay
        );

      }

    }

    catch(error){

      console.error(
        error
      );

    }

  }


  modal.classList.add(
    "show"
  );

}


/* =========================
   SELECT STAY
========================= */

function selectStay(
  value
){

  selectedStay =
    value;


  document
    .getElementById(
      "stayYes"
    )
    .classList
    .toggle(

      "selected",

      value === true

    );


  document
    .getElementById(
      "stayNo"
    )
    .classList
    .toggle(

      "selected",

      value === false

    );

}


/* =========================
   SAVE
========================= */

function saveData(){

  const year =
    Number(
      yearSelect.value
    );


  const month =
    Number(
      monthSelect.value
    );


  const key =
    createKey(
      year,
      month,
      selectedDay
    );


  const place =
    placeInput
      .value
      .trim();


  if(

    !place

    &&

    selectedStay === null

  ){

    localStorage.removeItem(
      key
    );

  }

  else{

    const data = {

      place:
        place,

      stay:
        selectedStay

    };


    localStorage.setItem(

      key,

      JSON.stringify(
        data
      )

    );

  }


  closeModal();


  renderCalendar();

}


/* =========================
   DELETE
========================= */

function deleteData(){

  const year =
    Number(
      yearSelect.value
    );


  const month =
    Number(
      monthSelect.value
    );


  const key =
    createKey(
      year,
      month,
      selectedDay
    );


  localStorage.removeItem(
    key
  );


  closeModal();


  renderCalendar();

}


/* =========================
   CLOSE POPUP
========================= */

function closeModal(){

  modal.classList.remove(
    "show"
  );


  placeInput.blur();

}


/*
  แตะพื้นหลัง
  เพื่อปิด Popup
*/

modal.addEventListener(

  "click",

  function(event){

    if(
      event.target === modal
    ){

      closeModal();

    }

  }

);


/* =========================
   SWIPE SYSTEM
========================= */

let touchStartX = 0;

let touchStartY = 0;

let touchCurrentX = 0;

let touchCurrentY = 0;

let isHorizontalSwipe =
  false;


/* =========================
   TOUCH START
========================= */

swipeArea.addEventListener(

  "touchstart",

  function(event){

    /*
      Popup เปิดอยู่
      ไม่รับ Swipe
    */

    if(
      modal.classList
        .contains(
          "show"
        )
    ){

      return;

    }


    const touch =
      event.touches[0];


    touchStartX =
      touch.clientX;


    touchStartY =
      touch.clientY;


    touchCurrentX =
      touchStartX;


    touchCurrentY =
      touchStartY;


    isHorizontalSwipe =
      false;

  },

  {
    passive:true
  }

);


/* =========================
   TOUCH MOVE
========================= */

swipeArea.addEventListener(

  "touchmove",

  function(event){

    if(
      modal.classList
        .contains(
          "show"
        )
    ){

      return;

    }


    const touch =
      event.touches[0];


    touchCurrentX =
      touch.clientX;


    touchCurrentY =
      touch.clientY;


    const diffX =

      touchCurrentX -
      touchStartX;


    const diffY =

      touchCurrentY -
      touchStartY;


    /*
      ถ้าเริ่มเคลื่อนแนวนอน
      มากกว่าแนวตั้ง

      ให้ถือว่าเป็น Swipe
    */

    if(

      Math.abs(diffX) > 10

      &&

      Math.abs(diffX) >
      Math.abs(diffY)

    ){

      isHorizontalSwipe =
        true;


      /*
        สำคัญมาก

        หยุด Safari
        ไม่ให้หน้าไหลขึ้นลง
        ระหว่าง Swipe
      */

      event.preventDefault();

    }

  },

  {
    passive:false
  }

);


/* =========================
   TOUCH END
========================= */

swipeArea.addEventListener(

  "touchend",

  function(){

    if(
      modal.classList
        .contains(
          "show"
        )
    ){

      return;

    }


    const diffX =

      touchCurrentX -
      touchStartX;


    const diffY =

      touchCurrentY -
      touchStartY;


    /*
      ต้องเป็น Swipe แนวนอนจริง

      และต้องลากเกิน 55px
    */

    if(

      isHorizontalSwipe

      &&

      Math.abs(diffX) > 55

      &&

      Math.abs(diffX) >
      Math.abs(diffY)

    ){

      /*
        ปัดซ้าย
        เดือนถัดไป
      */

      if(
        diffX < 0
      ){

        changeMonth(
          1
        );

      }


      /*
        ปัดขวา
        เดือนก่อนหน้า
      */

      else{

        changeMonth(
          -1
        );

      }

    }


    isHorizontalSwipe =
      false;

  },

  {
    passive:true
  }

);


/* =========================
   PREVENT PAGE BOUNCE
========================= */

document.addEventListener(

  "touchmove",

  function(event){

    /*
      ถ้า Popup ไม่ได้เปิด
      และกำลัง Swipe แนวนอน

      ไม่ให้หน้าเว็บขยับ
    */

    if(

      !modal.classList
        .contains(
          "show"
        )

      &&

      isHorizontalSwipe

    ){

      event.preventDefault();

    }

  },

  {
    passive:false
  }

);


/* =========================
   START
========================= */

renderCalendar();

</script>
